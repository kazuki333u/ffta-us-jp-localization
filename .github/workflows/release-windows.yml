name: release-windows

# Builds the Windows release folder (FFTA_JP_Builder) and zips it.
#
# No ROM is ever involved: the executable carries only this repository's code,
# Python and Pillow.  Japanese text, fonts and graphics are read from the
# user's own ROM when they run it.  The zip is built here, never on a
# maintainer's machine, so its provenance can be attested.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write       # attach the zip to a published release
      id-token: write       # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Build the release folder
        run: python -m PyInstaller --noconfirm --clean packaging/windows/ffta_us_jp.spec

      - name: Smoke test without a ROM
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/FFTA_JP_Builder/FFTA_JP_Builder.exe `
                 -ArgumentList '--smoke-test', "$env:RUNNER_TEMP/smoke.json" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP/smoke.json"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Assemble and zip
        shell: pwsh
        run: |
          $dir = 'dist/FFTA_JP_Builder'
          Copy-Item LICENSE, NOTICE.md -Destination $dir
          # ASCII name: zip tools disagree on how non-ASCII names are stored.
          Copy-Item packaging/windows/README_WINDOWS.txt -Destination "$dir/README.txt"
          "Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }}" |
            Out-File -Encoding utf8 "$dir/SOURCE.txt"
          $zip = 'FFTA_JP_Builder_windows.zip'
          Compress-Archive -Path $dir -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  $zip" |
            Out-File -Encoding ascii "$zip.sha256.txt"
          Get-Content "$zip.sha256.txt"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: FFTA_JP_Builder_windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FFTA_JP_Builder_windows
          path: |
            FFTA_JP_Builder_windows.zip
            FFTA_JP_Builder_windows.zip.sha256.txt

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          FFTA_JP_Builder_windows.zip FFTA_JP_Builder_windows.zip.sha256.txt --clobber
